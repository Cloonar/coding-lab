# Registry search config for nested containers in lab runs (ADR-0086).
#
# Without a search list podman cannot resolve a short image name ("mariadb",
# "ddev/ddev-webserver") and refuses it, while ddev, compose files and
# Dockerfiles all use Docker-style short names that mean Docker Hub. This
# makes them mean the same here. Debian ships no /etc/containers/registries.conf
# (its containers-common carries only the registries.conf.d/shortnames.conf
# aliases, which still apply on top of this); if a later package does ship one,
# this file replacing it is intended.

unqualified-search-registries = ["docker.io"]
