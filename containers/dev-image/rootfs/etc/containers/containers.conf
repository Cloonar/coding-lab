# Podman's system config for nested containers in lab runs (ADR-0086).
# Merged over Debian's defaults in /usr/share/containers/containers.conf; only
# the keys a lab run needs differently are set here.
#
# cgroups = "enabled": nested containers get their own cgroups under the
#   run's. They must stay enabled even though a run has no systemd: buildx's
#   buildkit container (what ddev builds its images with) asks for a cgroup
#   parent, and podman refuses that with "cannot set cgroup parent if not
#   creating cgroups" when cgroups are disabled. Being children of the run's
#   cgroup is also what keeps them inside the run's memory and pid caps.
# cgroup_manager = "cgroupfs": the default manager is systemd, and there is no
#   systemd inside a run, so podman writes the cgroup tree itself.
# events_logger = "file": the default is journald, which a run does not have
#   either; the file logger keeps events under the runtime dir.
#
# Inert outside a nested-mode run: nothing reads this until a session runs
# podman.

[containers]
cgroups = "enabled"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
