# CI = `nix flake check` (design §10): local and CI run the same gate.
# The stock `ubuntu-latest` runner has no nix, so the job installs it first
# (Determinate nix-installer, daemonless `--init none`) and runs the check in
# the same step. Runner prerequisites — outbound egress for the installer,
# proxy.golang.org, registry.npmjs.org, cache.nixos.org and the flake inputs —
# are documented in docs/ops.md.
name: ci

on:
  pull_request:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install nix + flake check
        run: |
          curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix \
            | sh -s -- install linux --no-confirm --init none
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix flake check -L

