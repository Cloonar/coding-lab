# CI = `nix flake check` (design §10): local and CI run the same gate.
# Runner prerequisites (nix with flakes, egress/mirrors for proxy.golang.org,
# registry.npmjs.org, cache.nixos.org and the flake inputs) are documented in
# docs/ops.md. The `nix` runs-on label is a placeholder — adjust it to the
# labels your Forgejo instance's runners actually advertise.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flake-check:
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
      - name: nix flake check
        run: nix flake check -L

